<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行合不合？｜Travel Match</title>
<style>
:root{--bg:#f6f7f3;--surface:#fff;--ink:#18342e;--muted:#65766f;--green:#087e65;--mint:#d9f3e7;--line:#dce5de;--yellow:#fff3d4;--danger:#ffe4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.6}header{padding:18px max(20px,calc((100% - 1040px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:19px}header small{color:var(--muted)}.wrap{max-width:1040px;margin:30px auto;padding:0 18px}.hero{background:linear-gradient(120deg,#073b32,#136a58);color:white;padding:34px;border-radius:24px;margin-bottom:20px}.hero h1{font-size:clamp(26px,4vw,42px);margin:6px 0}.hero p{color:#d1e8de;max-width:750px;margin-bottom:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab,button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}.tab{background:#e6ece8;color:var(--ink)}.tab.active,button.primary{background:var(--green);color:white}button.secondary{background:#e7f0eb;color:var(--ink)}button.ghost{background:white;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--danger);color:#8b332a}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 7px 25px #063c2910}.panel h2{margin-top:0;font-size:22px}.panel h3{margin:6px 0 16px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields label{font-weight:700;display:block;font-size:14px;margin-bottom:6px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cbdcd1;border-radius:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi article{background:#e9f4ed;border-radius:14px;text-align:center;padding:15px}.kpi strong{display:block;font-size:26px}.progress{height:9px;background:#e4ede7;border-radius:20px;overflow:hidden;margin:12px 0 22px}.progress div{height:100%;background:var(--green)}.question{border:1px solid var(--line);padding:18px;margin:12px 0;border-radius:16px}.question strong{display:block;margin-bottom:12px}.scale{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}.scale .end:last-child{text-align:right}.pick{display:flex;justify-content:center;gap:9px;margin-top:12px}.pick label{display:flex;align-items:center;justify-content:center;width:45px;height:45px;border:1px solid #cfddd4;border-radius:10px;cursor:pointer;font-weight:bold;background:#f9fcf9}.pick input{position:absolute;opacity:0;width:1px;height:1px}.pick label:has(input:checked){background:var(--green);border-color:var(--green);color:white}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#f6faf7;font-size:13px}.chip.good{background:var(--mint)}.chip.warn{background:var(--yellow)}.chip.bad{background:var(--danger)}table{width:100%;border-collapse:separate;border-spacing:5px}th,td{text-align:center;padding:10px 6px;font-size:14px;border-radius:7px}th{font-weight:700}td{background:#f1f6f2}td.good{background:#d5f1df}td.ok{background:#dceafa}td.warn{background:#ffefd0}td.bad{background:#ffe1da}.table-scroll{overflow:auto}.member{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.member:last-child{border:0}.meter{height:8px;background:#e4ebe6;border-radius:8px;overflow:hidden;flex:1}.meter div{height:100%;background:var(--green)}.hidden{display:none!important}.section-head{margin-top:18px}.notice{background:#fff6e1;border-radius:12px;padding:13px 16px;margin:10px 0}.checks{display:grid;gap:10px}.check{display:flex;gap:9px;align-items:flex-start}.check input{width:auto;margin-top:6px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:25px}.pill{background:#e0f2e8;border-radius:99px;padding:5px 10px;font-size:12px}.score{font-size:38px;font-weight:800;color:var(--green)}@media(max-width:650px){header{padding:14px 18px}.hero{padding:24px}.grid,.kpi{grid-template-columns:1fr}.panel{padding:17px}.pick{gap:6px}.pick label{width:42px;height:42px}.scale{font-size:13px}.row{align-items:stretch}th,td{font-size:12px;padding:8px 4px}}
@media print{header,.tabs,.actions,.no-print{display:none!important}body{background:white}.panel{break-inside:avoid;box-shadow:none}.hero{color:black;background:white;border:1px solid #ccc}.hero p{color:#444}}
</style>
</head>
<body><header><div><b>✈️ 旅行合不合？</b> <small>Travel Match</small></div><span class="pill" id="headerTeam">尚未建立團體</span></header>
<main class="wrap"><section class="hero"><small>TRAVEL COMPATIBILITY TEST</small><h1>出國前，先看看我們合不合！</h1><p>朋友、家人、親子團都能用。每位成人獨立填寫 24 道旅遊習慣與 6 道底線題，完成後自動比較團員契合度、發現可能的旅行摩擦。</p></section>
<nav class="tabs no-print" aria-label="主要功能"><button class="tab active" data-tab="team">① 建立團體</button><button class="tab" data-tab="answer">② 旅伴填答</button><button class="tab" data-tab="report">③ 契合分析</button><button class="tab" data-tab="settings">⚙️ 設定與資料</button></nav><div id="view"></div></main><footer class="footer">資料只儲存在目前瀏覽器；可透過私人分享連結由團主手動匯入。分享連結包含可讀取的問卷答案，請勿公開轉傳。分數僅供旅遊協調參考，不是心理測驗診斷。</footer>
<script>
'use strict';
const KEY='travel-match-v1';
const categories=[{name:'行程節奏',weight:20,qs:[['每天安排滿滿景點','每天保留大量自由時間'],['早上 7 點就出發','10 點以後才出門'],['喜歡事先排好時間表','喜歡當天隨興決定'],['想多跑幾個不同地方','寧願少量景點深度停留']]},{name:'交通與體力',weight:20,qs:[['願意一天走 15,000 步以上','希望少走路、多搭車'],['搭大眾交通省錢比較好','多花錢搭車更方便'],['轉車、轉乘都能接受','希望交通越直接越好'],['累了仍願意完成行程','累了就希望立刻休息']]},{name:'飲食與購物',weight:15,qs:[['願意排隊 60 分鐘吃名店','不想排隊、方便就好'],['喜歡當地特色和陌生料理','偏好熟悉安全的口味'],['用餐願意花時間慢慢享受','希望快速吃完繼續行程'],['每天都想安排購物時間','不喜歡購物行程']]},{name:'金錢與消費',weight:15,qs:[['重視價格、精打細算','願意花更多錢換取舒適'],['希望團體費用盡量平均分攤','希望每筆按實際使用計算'],['願意為特殊體驗加預算','希望嚴守原本預算'],['消費希望每筆記帳清楚','小額差異不太計較']]},{name:'住宿與生活',weight:10,qs:[['重視住宿品質和設備','只要乾淨能睡就好'],['可以跟其他旅伴共用房間','偏好自己或小家庭獨立空間'],['晚上還想聚會聊天','晚上想早點休息'],['喜歡大家一起行動','希望有個人或家庭自由時間']]},{name:'團體協調與情緒',weight:20,qs:[['非常重視準時','可以接受一些延遲'],['不喜歡臨時更改行程','願意隨時彈性調整'],['有分歧時希望投票決定','有分歧時希望各自活動'],['旅行發生問題希望立刻討論','希望先冷靜、之後再討論']]}];
const dislikes=['遲到','超出預算','強迫購物','趕行程','長時間排隊','臨時更動行程','大家一定要一起行動','飲食不合','走太多路','住宿安排不合'];
const defaults=()=>({team:{name:'',destination:'',date:''},weights:categories.map(x=>x.weight),members:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(db.members)||!Array.isArray(db.weights))db=defaults()}catch{db=defaults()}
let tab='team',editing=null,step=0,draft=null,shareIndex=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(db));$('#headerTeam').textContent=db.team.name||'尚未建立團體'}
function goto(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>goto(x.dataset.tab));
const view=()=>$('#view');
function render(){persist();if(tab==='team')renderTeam();if(tab==='answer')renderAnswer();if(tab==='report')renderReport();if(tab==='settings')renderSettings();if(tab==='share')renderShare()}
function renderTeam(){view().innerHTML=`<section class="panel"><h2>建立旅行團</h2><p class="muted">先為這趟旅行取個名字，朋友可使用邀請連結在各自手機填寫，完成後把答案連結私訊團主。團主逐一開啟連結匯入，即可分析。</p><form id="teamform" class="fields"><div class="grid"><div><label>團體名稱</label><input name="name" maxlength="80" required placeholder="例如：2027 大阪親友團" value="${esc(db.team.name)}"></div><div><label>旅遊目的地</label><input name="destination" maxlength="80" placeholder="例如：日本大阪" value="${esc(db.team.destination)}"></div><div><label>出發日期（選填）</label><input type="date" name="date" value="${esc(db.team.date)}"></div></div><div class="actions"><button class="primary">儲存旅行團</button><button type="button" class="secondary" id="start">開始填答 →</button><button type="button" class="ghost" id="invite">複製邀請連結</button></div></form></section><section class="panel"><div class="row"><h2>已加入的旅伴</h2><span class="pill">${db.members.length} 位成人</span></div>${db.members.length?db.members.map((m,i)=>`<div class="member"><div><strong>${esc(m.name)}</strong><div class="tiny">${esc(m.role)} · ${m.answers.filter(x=>x>=1&&x<=5).length}/24 題已完成</div></div><div><button class="primary" data-share="${i}">分享答案</button> <button class="secondary" data-edit="${i}">修改</button> <button class="danger" data-delete="${i}">刪除</button></div></div>`).join(''):'<p class="muted">尚無成員，新增第一位旅伴開始。</p>'}<div class="actions"><button class="primary" id="newperson">＋ 新增旅伴</button><button class="ghost" id="viewreport">查看團體報告</button></div></section>`;
$('#teamform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.team={name:String(f.get('name')).trim(),destination:String(f.get('destination')).trim(),date:String(f.get('date'))};persist();alert('旅行團已儲存！')};$('#start').onclick=()=>newPerson();$('#invite').onclick=()=>copyText(baseUrl()+'#answer','已複製邀請連結，請傳給每位旅伴。');$('#newperson').onclick=()=>newPerson();$('#viewreport').onclick=()=>goto('report');view().querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{shareIndex=+b.dataset.share;goto('share')});view().querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPerson(+b.dataset.edit));view().querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這位旅伴的回答？')){db.members.splice(+b.dataset.delete,1);render()}})}
function newPerson(){if(db.members.length>=20)return alert('已達 20 人上限');editing=null;step=0;draft={name:'',role:'成人',answers:Array(24).fill(null),limits:{currency:'TWD',min:'',max:'',walk:'60',room:'conditional',diet:'',solo:'discuss',dislikes:[]}};goto('answer')}
function editPerson(i){editing=i;step=0;draft=JSON.parse(JSON.stringify(db.members[i]));goto('answer')}
function field(label,html){return `<div class="fields"><label>${label}</label>${html}</div>`}
function renderAnswer(){if(!draft){view().innerHTML=`<section class="panel"><h2>旅伴填答</h2><p class="muted">每人獨立填寫，避免互相影響。填完一位再讓下一位接手這台裝置。</p><button class="primary" id="add">＋ 新增旅伴並開始測驗</button></section>`;$('#add').onclick=newPerson;return}
let progress=Math.round(step/8*100);let html=`<section class="panel"><div class="row"><h2>${editing===null?'新增旅伴':'編輯旅伴'}</h2><span class="pill">步驟 ${step+1} / 8</span></div><div class="progress"><div style="width:${progress}%"></div></div><form id="survey">`;
if(step===0){html+=`<h3>基本資料</h3><div class="grid">${field('你的暱稱',`<input name="name" required maxlength="40" value="${esc(draft.name)}" placeholder="例如：小明">`)}${field('旅行角色',`<select name="role">${['成人','長輩','親子家長','主辦人'].map(r=>`<option ${draft.role===r?'selected':''}>${r}</option>`).join('')}</select>`)}</div><div class="notice">孩子的需求由家長在底線欄位補充，不把孩子的回答當作成人配對分數。</div>`}
else if(step<=6){const cat=categories[step-1];html+=`<h3>${step}. ${cat.name}</h3><p class="muted">選擇最接近自己的習慣：1 非常偏左、3 都可以、5 非常偏右。</p>`;cat.qs.forEach((q,i)=>{const ix=(step-1)*4+i;html+=`<div class="question"><strong>Q${ix+1}：你比較接近哪一邊？</strong><div class="scale"><span class="end">${esc(q[0])}</span><span>↔</span><span class="end">${esc(q[1])}</span></div><div class="pick">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="q${ix}" value="${v}" required ${draft.answers[ix]===v?'checked':''}>${v}</label>`).join('')}</div></div>`})}
else{const l=draft.limits;html+=`<h3>6 道旅行底線題</h3><p class="muted">底線不直接併入契合度，會另外標示需要協調的問題。</p><div class="grid">${field('H1 每人每日最低可接受花費（不含機票）',`<input type="number" min="0" name="min" value="${esc(l.min)}" placeholder="如 1500">`)}${field('H1 每人每日預算上限（不含機票）',`<input type="number" min="0" name="max" value="${esc(l.max)}" placeholder="如 3000">`)}${field('金額幣別',`<select name="currency">${['TWD','JPY','KRW','USD','EUR'].map(c=>`<option ${l.currency===c?'selected':''}>${c}</option>`).join('')}</select>`)}${field('H2 每日最多可接受的步行總時間',`<select name="walk">${[['30','30 分鐘'],['60','60 分鐘'],['90','90 分鐘'],['120','120 分鐘'],['999','不限']].map(([v,t])=>`<option value="${v}" ${l.walk===v?'selected':''}>${t}</option>`).join('')}</select>`)}${field('H3 與其他家庭共用住宿空間？',`<select name="room">${[['yes','可以'],['conditional','有條件接受'],['no','不可以']].map(([v,t])=>`<option value="${v}" ${l.room===v?'selected':''}>${t}</option>`).join('')}</select>`)}${field('H5 旅伴希望分開行動時？',`<select name="solo">${[['yes','可以'],['discuss','需要事先討論'],['no','不能接受']].map(([v,t])=>`<option value="${v}" ${l.solo===v?'selected':''}>${t}</option>`).join('')}</select>`)}</div>${field('H4 必須遵守的飲食、無障礙或照護需求',`<textarea name="diet" placeholder="沒有可留空，例如：有長輩膝蓋不適、孩子食物過敏">${esc(l.diet)}</textarea>`)}<div class="fields"><label>H6 最不能接受的三件事（最多三項）</label><div class="checks">${dislikes.map((d,i)=>`<label class="check"><input type="checkbox" name="dislike" value="${esc(d)}" ${l.dislikes.includes(d)?'checked':''}>${esc(d)}</label>`).join('')}</div></div>`}
html+=`<div class="actions">${step>0?'<button type="button" class="secondary" id="prev">← 上一步</button>':''}<button class="primary" type="submit">${step===7?'完成並儲存':'下一步 →'}</button><button class="ghost" type="button" id="cancel">取消</button></div></form></section>`;view().innerHTML=html;
const form=$('#survey');if(step===7)form.querySelectorAll('[name="dislike"]').forEach(el=>el.addEventListener('change',()=>{const selected=[...form.querySelectorAll('[name="dislike"]:checked')];if(selected.length>3){el.checked=false;alert('最多只能選三項')}}));
form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);if(step===0){const name=String(fd.get('name')||'').trim();if(!name)return alert('請填寫暱稱');draft.name=name;draft.role=fd.get('role')}
else if(step<=6){for(let ix=(step-1)*4;ix<step*4;ix++){const v=Number(fd.get('q'+ix));if(!v)return alert('請完成這頁全部題目');draft.answers[ix]=v}}
else{const l={currency:fd.get('currency'),min:fd.get('min'),max:fd.get('max'),walk:fd.get('walk'),room:fd.get('room'),diet:String(fd.get('diet')||'').trim(),solo:fd.get('solo'),dislikes:fd.getAll('dislike')};if(l.min!==''&&l.max!==''&&Number(l.min)>Number(l.max))return alert('最低可接受花費不能高於最高預算');draft.limits=l}
if(step===7){if(db.members.some((m,i)=>i!==editing&&m.name===draft.name))return alert('這個暱稱已被使用，請使用不同暱稱');if(editing===null){if(db.members.length>=20)return alert('本問卷最多支援 20 位成員');db.members.push(draft);shareIndex=db.members.length-1}else{db.members[editing]=draft;shareIndex=editing}persist();draft=null;editing=null;step=0;goto('share')}else{step++;renderAnswer();window.scrollTo({top:0,behavior:'smooth'})}};
const prev=$('#prev');if(prev)prev.onclick=()=>{saveCurrent(form);step--;renderAnswer()};$('#cancel').onclick=()=>{if(confirm('取消本次編輯？未完成的內容不會保存。')){draft=null;editing=null;goto('team')}}}
function saveCurrent(form){const fd=new FormData(form);if(step===0){draft.name=String(fd.get('name')||'').trim();draft.role=fd.get('role')}else if(step<=6){for(let ix=(step-1)*4;ix<step*4;ix++){const v=Number(fd.get('q'+ix));draft.answers[ix]=v||draft.answers[ix]}}}
function pair(a,b){const catScores=categories.map((c,i)=>c.qs.map((_,j)=>{const x=a.answers[i*4+j],y=b.answers[i*4+j];return 100*(1-Math.abs(x-y)/4)}).reduce((x,y)=>x+y,0)/4);const total=catScores.reduce((s,v,i)=>s+v*db.weights[i]/100,0);return {total,catScores}}
function cls(n){return n>=85?'good':n>=70?'ok':n>=55?'warn':'bad'}
function band(n){return n>=85?'超級旅伴':n>=70?'適合同行':n>=55?'需要磨合':n>=40?'高衝突風險':'不建議全程綁定'}
function bottomWarnings(a,b){let out=[];let x=a.limits,y=b.limits;if(x.currency===y.currency&&x.max!==''&&y.min!==''&&Number(x.max)<Number(y.min))out.push(`${a.name} 的預算上限低於 ${b.name} 的最低花費預期`);if(x.currency===y.currency&&y.max!==''&&x.min!==''&&Number(y.max)<Number(x.min))out.push(`${b.name} 的預算上限低於 ${a.name} 的最低花費預期`);if(x.currency!==y.currency)out.push('預算幣別不同，需統一幣別再比較');if(Math.abs(Number(x.walk)-Number(y.walk))>=60)out.push('可接受步行時間差距較大');if(x.room!==y.room&&(x.room==='no'||y.room==='no'))out.push('住宿共用偏好不同，需確認房型安排');if(x.solo!==y.solo&&(x.solo==='no'||y.solo==='no'))out.push('對分開行動的接受度不同');const dx=x.dislikes||[],dy=y.dislikes||[];dx.forEach(d=>{if(d==='趕行程'&&b.answers[0]<=2)out.push(`${a.name} 不接受趕行程，${b.name} 偏好密集行程`);if(d==='走太多路'&&b.answers[4]<=2)out.push(`${a.name} 不接受走太多路，${b.name} 偏好大量步行`)});dy.forEach(d=>{if(d==='趕行程'&&a.answers[0]<=2)out.push(`${b.name} 不接受趕行程，${a.name} 偏好密集行程`);if(d==='走太多路'&&a.answers[4]<=2)out.push(`${b.name} 不接受走太多路，${a.name} 偏好大量步行`)});return [...new Set(out)]}
function renderReport(){const m=db.members;if(m.length<2){view().innerHTML=`<section class="panel"><h2>契合度分析</h2><p class="muted">至少需要 2 位完成填答的成人，才能計算配對結果。目前有 ${m.length} 位。</p><button class="primary" id="add">＋ 新增旅伴</button></section>`;$('#add').onclick=newPerson;return}
const pairs=[];for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++)pairs.push({i,j,...pair(m[i],m[j]),warnings:bottomWarnings(m[i],m[j])});const avg=pairs.reduce((s,p)=>s+p.total,0)/pairs.length;const sorted=[...pairs].sort((a,b)=>b.total-a.total);const worst=sorted.at(-1);const meanCats=categories.map((c,i)=>pairs.reduce((s,p)=>s+p.catScores[i],0)/pairs.length);const allWarnings=pairs.flatMap(p=>p.warnings.map(w=>`${m[p.i].name} × ${m[p.j].name}：${w}`));const notes=m.filter(x=>x.limits.diet.trim()).map(x=>`${x.name}：${x.limits.diet}`);
let html=`<section class="panel"><div class="row"><div><h2>團體契合度報告</h2><p class="muted">${esc(db.team.name||'未命名旅行團')} ${esc(db.team.destination?'｜'+db.team.destination:'')}</p></div><div><div class="score">${avg.toFixed(1)}%</div><strong>${band(avg)}</strong></div></div><div class="kpi"><article><strong>${m.length}</strong>成人旅伴</article><article><strong>${pairs.length}</strong>配對組合</article><article><strong>${allWarnings.length}</strong>項需協調提醒</article></div><div class="notice">團體平均分只是參考。即使總分高，仍須處理預算、身體限制、住宿與照護等必要條件。</div></section>`;
html+=`<section class="panel"><h2>旅伴契合度矩陣</h2><div class="table-scroll"><table><thead><tr><th></th>${m.map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr></thead><tbody>${m.map((a,i)=>`<tr><th>${esc(a.name)}</th>${m.map((b,j)=>{if(i===j)return'<td>—</td>';const p=pair(a,b).total;return`<td class="${cls(p)}"><b>${Math.round(p)}%</b></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="chips"><span class="chip good">85%+ 高度合拍</span><span class="chip">70%+ 適合同行</span><span class="chip warn">55%+ 需磨合</span><span class="chip bad">低於 55% 高風險</span></div></section>`;
html+=`<section class="panel"><h2>六大面向整團平均</h2>${categories.map((c,i)=>`<div class="row" style="margin:12px 0"><span style="width:120px">${c.name}</span><div class="meter"><div style="width:${meanCats[i].toFixed(1)}%"></div></div><b>${meanCats[i].toFixed(0)}%</b></div>`).join('')}</section>`;
html+=`<section class="panel"><h2>所有旅伴配對</h2>${sorted.map(p=>`<div class="member"><div><strong>${esc(m[p.i].name)} × ${esc(m[p.j].name)}</strong><div class="tiny">${band(p.total)} · ${p.warnings.length} 項提醒</div></div><button class="secondary" data-pair="${p.i},${p.j}">${p.total.toFixed(1)}%　查看</button></div>`).join('')}</section>`;
html+=`<section class="panel"><h2>需要優先協調的問題</h2>${allWarnings.length?`<div class="checks">${allWarnings.map(w=>`<div class="notice">⚠️ ${esc(w)}</div>`).join('')}</div>`:'<p class="muted">目前未發現自動規則可辨識的重大偏好衝突，但仍需實際討論。</p>'}${notes.length?`<h3 class="section-head">飲食、行動及照護需求</h3>${notes.map(n=>`<div class="notice">${esc(n)}</div>`).join('')}`:''}<p class="tiny">此處為規則提示，不代表醫療或無障礙評估。預算只有在相同幣別時才直接比較，且未設定共同支出金額時無法判斷是否超支。</p></section>`;
html+=`<section class="panel"><h2>旅行公約建議</h2><div class="checks">${['集合準時，遲到超過 10 分鐘先用訊息確認','每天安排固定自由活動時段，允許事先協調分組','共同支出事先列出金額及分攤方式','行動能力較弱者的交通與休息需求優先確認','排隊、購物與臨時加點採協商，不強迫所有人參加'].map(x=>`<label class="check"><input type="checkbox">${x}</label>`).join('')}</div><div class="actions"><button class="primary" id="print">列印或另存 PDF</button><button class="secondary" id="exportReport">下載文字摘要</button></div></section>`;
view().innerHTML=html;$('#print').onclick=()=>window.print();$('#exportReport').onclick=()=>{const lines=[`團體：${db.team.name||'未命名'}`,`團體契合度：${avg.toFixed(1)}%`,...sorted.map(p=>`${m[p.i].name} × ${m[p.j].name}：${p.total.toFixed(1)}%`),'','需要協調：',...allWarnings,'','特殊需求：',...notes];download('travel-match-report.txt',lines.join('\n'),'text/plain;charset=utf-8')};view().querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.pair.split(',').map(Number);renderPair(i,j)})}
function renderPair(i,j){const a=db.members[i],b=db.members[j],p=pair(a,b),notes=bottomWarnings(a,b);view().innerHTML=`<section class="panel"><button class="ghost" id="back">← 返回報告</button><h2>${esc(a.name)} × ${esc(b.name)}</h2><div class="score">${p.total.toFixed(1)}%</div><p>${band(p.total)}</p><h3>六大面向配對分數</h3>${categories.map((c,k)=>`<div class="row" style="margin:13px 0"><span style="width:120px">${c.name}</span><div class="meter"><div style="width:${p.catScores[k].toFixed(1)}%"></div></div><b>${p.catScores[k].toFixed(0)}%</b></div>`).join('')}<h3>差異最大的核心題目</h3>${categories.flatMap((c,ci)=>c.qs.map((q,qi)=>({q,num:ci*4+qi,delta:Math.abs(a.answers[ci*4+qi]-b.answers[ci*4+qi])}))).sort((x,y)=>y.delta-x.delta).slice(0,5).map(x=>`<div class="notice"><strong>Q${x.num+1}　${esc(x.q[0])} ↔ ${esc(x.q[1])}</strong><br>${esc(a.name)}：${a.answers[x.num]} 分｜${esc(b.name)}：${b.answers[x.num]} 分</div>`).join('')}<h3>底線提示</h3>${notes.length?notes.map(x=>`<div class="notice">⚠️ ${esc(x)}</div>`).join(''):'<p class="muted">無自動偵測到的底線警示。</p>'}</section>`;$('#back').onclick=renderReport}
function renderSettings(){view().innerHTML=`<section class="panel"><h2>契合度權重</h2><p class="muted">六類權重總和必須等於 100%。預設是 20 / 20 / 15 / 15 / 10 / 20。</p><form id="weightform"><div class="grid">${categories.map((c,i)=>field(c.name,`<input type="number" name="w${i}" min="0" max="100" step="5" required value="${db.weights[i]}">`)).join('')}</div><div class="actions"><button class="primary">儲存權重</button><button type="button" class="secondary" id="resetWeights">恢復預設</button></div></form></section><section class="panel"><h2>備份與搬移資料</h2><p class="muted">請匯出 JSON 備份。換裝置時可以手動匯入，但不會自動同步。匯出檔含所有旅伴的個人回答與需求，請妥善保存。</p><div class="actions"><button class="primary" id="backup">匯出 JSON 備份</button><label class="tab">匯入 JSON <input id="upload" type="file" accept=".json,application/json" style="display:none"></label><button class="danger" id="clear">刪除全部資料</button></div></section>`;$('#weightform').onsubmit=e=>{e.preventDefault();const v=categories.map((_,i)=>Number(new FormData(e.target).get('w'+i)));if(v.some(x=>!Number.isFinite(x)||x<0)||v.reduce((a,b)=>a+b,0)!==100)return alert('六類權重總和須為 100%，且不可為負數');db.weights=v;persist();alert('已儲存權重！')};$('#resetWeights').onclick=()=>{db.weights=categories.map(c=>c.weight);render()};$('#backup').onclick=()=>download('travel-match-backup.json',JSON.stringify(db,null,2),'application/json');$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const value=JSON.parse(await f.text());if(!value||!value.team||!Array.isArray(value.members)||!Array.isArray(value.weights)||value.weights.length!==6||value.weights.some(v=>typeof v!=='number'||v<0)||value.weights.reduce((a,b)=>a+b,0)!==100||value.members.some(m=>typeof m.name!=='string'||!Array.isArray(m.answers)||m.answers.length!==24||m.answers.some(x=>!Number.isInteger(x)||x<1||x>5)||!m.limits||!Array.isArray(m.limits.dislikes)))throw Error('檔案格式不符');if(!confirm('匯入資料會覆蓋目前的旅行團，確定要繼續？'))return;db=value;persist();render();alert('匯入成功')}catch(err){alert('無法匯入：'+err.message)}};$('#clear').onclick=()=>{if(confirm('確定要永久清除這台瀏覽器的旅行團、所有旅伴與回答？')){db=defaults();persist();goto('team')}}}

function baseUrl(){return location.origin+location.pathname+location.search}
function encodeMember(member){const raw=JSON.stringify({v:2,type:'travel-match-member',member});const bytes=new TextEncoder().encode(raw);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary).split('+').join('-').split('/').join('_').replace(/=+$/,'')}
function decodeMember(token){if(!/^[A-Za-z0-9_-]{1,16000}$/.test(token))throw Error('分享資料格式不符');const binary=atob(token.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.length%4)%4));const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(binary,c=>c.charCodeAt(0))));if(data.v!==2||data.type!=='travel-match-member'||!validMember(data.member))throw Error('分享資料不完整');return data.member}
function validMember(m){return m&&typeof m.name==='string'&&m.name.trim().length>0&&m.name.length<=40&&typeof m.role==='string'&&m.role.length<=40&&Array.isArray(m.answers)&&m.answers.length===24&&m.answers.every(x=>Number.isInteger(x)&&x>=1&&x<=5)&&m.limits&&typeof m.limits==='object'&&Array.isArray(m.limits.dislikes)&&m.limits.dislikes.length<=10&&typeof m.limits.diet==='string'&&m.limits.diet.length<=3000&&['TWD','JPY','KRW','USD','EUR'].includes(m.limits.currency)&&['30','60','90','120','999'].includes(String(m.limits.walk))&&['yes','conditional','no'].includes(m.limits.room)&&['yes','discuss','no'].includes(m.limits.solo)&&['min','max'].every(k=>m.limits[k]===''||Number.isFinite(Number(m.limits[k]))&&Number(m.limits[k])>=0)}
async function copyText(value,message){try{await navigator.clipboard.writeText(value);alert(message)}catch{prompt('請複製以下連結：',value)}}
function renderShare(){const m=db.members[shareIndex];if(!m){goto('team');return}const link=baseUrl()+'#import='+encodeMember(m);view().innerHTML=`<section class="panel"><h2>✅ ${esc(m.name)} 的問卷已完成</h2><p class="muted">請把專屬答案連結透過 LINE 私訊給團主。團主點開連結並確認匯入，即可加入團體分析。</p><div class="notice"><strong>隱私提醒：</strong>答案連結含你的暱稱、24 題回答、預算和特殊需求；僅為編碼，並非加密。請勿傳到公開群組，也不要張貼於網路。</div><div class="actions"><button class="primary" id="shareLink">分享我的答案</button><button class="secondary" id="copyLink">複製答案連結</button><button class="ghost" id="backTeam">返回團體</button></div><p class="tiny">此版本不會自動傳送資料；團主必須逐一匯入。若重新修改回答，需重新分享新連結。</p></section>`;$('#copyLink').onclick=()=>copyText(link,'答案連結已複製，請私訊團主。');$('#shareLink').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Travel Match｜'+m.name+' 的問卷答案',text:'我的旅遊契合度問卷已完成，請團主開啟並匯入：',url:link})}catch(e){if(e.name!=='AbortError')copyText(link,'答案連結已複製')}}else copyText(link,'答案連結已複製，請貼到 LINE 私訊團主。')};$('#backTeam').onclick=()=>goto('team')}
function processIncoming(){const h=location.hash; if(h==='#answer'){history.replaceState(null,'',baseUrl());newPerson();return}if(!h.startsWith('#import='))return;history.replaceState(null,'',baseUrl());let member;try{member=decodeMember(h.slice(8))}catch(e){alert('無法讀取答案連結：'+e.message);return}const existing=db.members.findIndex(x=>x.name===member.name);if(existing<0&&db.members.length>=20){alert('本團已達 20 人上限，無法匯入');return}const msg=existing>=0?`已存在「${member.name}」的答案。要用這份新答案覆蓋嗎？`:`要把「${member.name}」的問卷匯入這台裝置的旅行團嗎？\\n匯入後才能納入契合度分析。`;if(!confirm(msg))return;if(existing>=0)db.members[existing]=member;else db.members.push(member);persist();goto('team');alert('已匯入 '+member.name+' 的答案。')}

function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();processIncoming();
</script></body></html>
